<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gracias — Josué 37</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#160d07">
<link rel="icon" type="image/png" sizes="48x48" href="/img/jz-48.png"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Mr+Dafoe&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<style>
.card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:20px;padding:26px 22px;margin-bottom:18px;text-align:center}
.card h2{font-family:'Mr Dafoe',cursive;font-weight:400;font-size:2.6rem;line-height:1.2;padding:.1em 0}
.card p{color:var(--mut)}
.vid{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000;margin-bottom:18px}
.vid iframe,.vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
.ph{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;border:1px solid var(--line);cursor:zoom-in}
.act{text-align:center;margin:18px 0}
#lb{position:fixed;inset:0;z-index:200;background:rgba(5,3,1,.95);display:none}
#lb.on{display:flex}#lb img{margin:auto;max-width:96vw;max-height:90vh;border-radius:10px}
#lbx{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);background:rgba(22,13,7,.85);color:var(--gold);font-size:1.2rem;cursor:pointer}
.slider{position:relative;aspect-ratio:3/1;max-width:460px;margin:0 auto 18px;display:none}
.slider.show{display:block}
.sgroup{position:absolute;inset:0;display:flex;gap:8px;opacity:0;transition:opacity 1.1s ease}
.sgroup.on{opacity:1}
.sgroup img{flex:1;min-width:0;aspect-ratio:1;object-fit:cover;border-radius:14px;border:1px solid var(--line);background:#000}
#snd{position:fixed;right:16px;bottom:16px;z-index:60;width:52px;height:52px;border-radius:50%;border:1px solid var(--gold);background:rgba(22,13,7,.78);backdrop-filter:blur(8px);cursor:pointer;display:grid;place-items:center;transition:.25s}
#snd:hover{background:var(--gold)}#snd:hover svg{stroke:#1a0f08}
#snd svg{width:24px;height:24px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#snd .off{display:none}#snd.muted .on{display:none}#snd.muted .off{display:block}
.pcount{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--mut);font-size:.75rem;letter-spacing:.05em}
.pcount b{color:var(--gold)}
.ig{max-width:360px;margin:18px auto 0}
.ig video{width:100%;display:block;border-radius:16px;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.55)}
</style></head><body>
<canvas id="side"></canvas>
<button id="snd" type="button" class="muted" aria-label="Silenciar o activar sonido">
  <svg class="on" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <svg class="off" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6m0-6 6 6"/></svg>
</button>
<div id="yt" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"></div>
<div class="wrap">
  <div class="top"><img src="/img/jz-192.png" alt="JZ" style="width:56px;height:56px;border-radius:14px;display:block;margin:0 auto 4px"><div class="t gold">Josué 37</div><div class="s">Sunset Party</div></div>
  <div class="card"><h2 class="gold" id="ti">Gracias</h2><p id="tx"></p></div>
  <div id="media"></div>
  <div class="slider" id="slider"></div>
  <div style="text-align:center"><div id="pcount" style="display:none" class="pcount"><span id="pcount-tx"></span></div></div>
  <div class="act" id="act"></div>
  <div class="ig">
    <video id="igvid" src="/video/josue37.mp4" poster="/video/josue37-poster.jpg" controls playsinline preload="metadata"></video>
  </div>
</div>
<footer><a href="/">← Volver a la invitación</a><br><br>JOSUÉ 37 · SUNSET PARTY</footer>
<div id="lb"><button id="lbx" type="button" aria-label="Cerrar">✕</button><img id="lbi" alt=""></div>
<script src="/shared.js"></script>
<script>
// ===== Música de fondo (misma pista que la invitación) =====
(()=>{const VID='FxDMMeWK1ZE';let yt=null,ytReady=false;
const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
window.onYouTubeIframeAPIReady=()=>{yt=new YT.Player('yt',{videoId:VID,playerVars:{controls:0,disablekb:1,fs:0,rel:0,modestbranding:1,playsinline:1,loop:1,playlist:VID,mute:1,autoplay:1},
events:{onReady:()=>{ytReady=true;yt.playVideo()},onStateChange:e=>{if(e.data===YT.PlayerState.PAUSED||e.data===YT.PlayerState.ENDED)yt.playVideo()}}})};
setInterval(()=>{if(!ytReady)return;try{const s=yt.getPlayerState();if(s!==YT.PlayerState.PLAYING&&s!==YT.PlayerState.BUFFERING)yt.playVideo()}catch(e){}},1500);
document.getElementById('snd').addEventListener('click',()=>{if(!ytReady)return;const m=yt.isMuted();m?yt.unMute():yt.mute();document.getElementById('snd').classList.toggle('muted',!m)});
document.getElementById('igvid')?.addEventListener('play',()=>{if(ytReady&&!yt.isMuted()){yt.mute();document.getElementById('snd').classList.add('muted')}});
})();
(async()=>{
 const slug=decodeURIComponent(location.pathname.split('/').filter(Boolean)[1]||'').toLowerCase();
 let c={};try{c=await (await fetch('/gracias/config.json',{cache:'no-store'})).json()}catch(e){}
 // Link variable: /gracias/<clave> redirige al enlace que definas en "links"
 const l=c.links&&c.links[slug];if(l&&/^https?:\/\//.test(l)){location.replace(l);return}
 ti.textContent=c.titulo||'Gracias';tx.textContent=c.texto||'';
 const m=document.getElementById('media');let any=false;
 if(c.video){any=true;const y=c.video.match(/(?:v=|youtu\.be\/|embed\/|^)([\w-]{11})(?:[&?]|$)/);
  m.insertAdjacentHTML('beforeend',/youtu/.test(c.video)||/^[\w-]{11}$/.test(c.video)&&y?`<div class="vid"><iframe src="https://www.youtube.com/embed/${y[1]}?rel=0&playsinline=1" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe></div>`:`<div class="vid"><video src="${c.video}" controls playsinline></video></div>`)}
 if(c.fotos&&c.fotos.length){any=true;m.insertAdjacentHTML('beforeend','<div class="ph">'+c.fotos.map(f=>`<img src="${f}" loading="lazy" alt="Foto de la noche">`).join('')+'</div>')}
 if(c.album&&/^https?:\/\//.test(c.album)){
  any=true;act.innerHTML=`<a class="btn fill" href="${c.album}" target="_blank" rel="noopener">Ver álbum completo</a>`;
  try{
   const r=await fetch('https://eventos.fusionia.com.ar/api/album/josue/recent',{cache:'no-store'});
   const {ids,count}=await r.json();
   if(count){document.getElementById('pcount-tx').innerHTML=`<b>${count}</b> fotos`;document.getElementById('pcount').style.display='inline-flex'}
   if(ids&&ids.length){
    const sl=document.getElementById('slider');sl.classList.add('show');
    // Tandas de 3 fotos que se van apareciendo (crossfade), rotando entre los grupos.
    const groups=[];for(let g=0;g<ids.length;g+=3)groups.push(ids.slice(g,g+3));
    sl.innerHTML=groups.map((g,gi)=>`<div class="sgroup${gi===0?' on':''}">${g.map((id,i)=>`<img src="https://eventos.fusionia.com.ar/api/foto/${id}.jpg?w=500" loading="${gi===0?'eager':'lazy'}" alt="Foto de la noche">`).join('')}</div>`).join('');
    if(groups.length>1){
     const els=sl.querySelectorAll('.sgroup');let gi=0;
     setInterval(()=>{els[gi].classList.remove('on');gi=(gi+1)%els.length;els[gi].classList.add('on')},3500);
    }
   }
  }catch(e){}
 }
 if(!any)m.innerHTML='<div class="card"><p>Muy pronto vas a poder ver acá las fotos y el video de la noche. ¡Gracias por ser parte! 💛</p></div>';
 m.addEventListener('click',e=>{if(e.target.matches('.ph img')){lbi.src=e.target.src;lb.classList.add('on')}});
 const cl=()=>lb.classList.remove('on');lbx.onclick=cl;lb.onclick=e=>{if(e.target===lb)cl()};addEventListener('keydown',e=>{if(e.key==='Escape')cl()});
})();
</script><script src="/wa.js" defer></script></body></html>
